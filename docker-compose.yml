services:
  api-gateway:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "5000:5000"
    env_file:
      - ./api/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BULLMQIP=redis
      - BULLMQPORT=6379
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672
      - MEILI_HOST=http://meilisearch:7700
      - USER_SERVICE_URL=http://10.10.26.159:5001
      - AGENT_SERVICE_URL=http://10.10.26.159:5002
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      meilisearch:
        condition: service_started
      user-service:
        condition: service_started
      agent-service:
        condition: service_started
    networks:
      - micro-net
    restart: unless-stopped

  # -------- User Service --------
  user-service:
    build:
      context: ./userService
      dockerfile: Dockerfile
    container_name: user-service
    expose:
      - "5001"
    env_file:
      - ./userService/.env
    environment:
      - PORT=5001
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BULLMQIP=redis
      - BULLMQPORT=6379
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672
      - MEILI_HOST=http://meilisearch:7700
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      meilisearch:
        condition: service_started
    networks:
      - micro-net
    restart: unless-stopped

  # -------- Agent Service --------
  agent-service:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: agent-service
    expose:
      - "5002"
    env_file:
      - ./agent/.env
    environment:
      - PORT=5002
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BULLMQIP=redis
      - BULLMQPORT=6379
      - RABBITMQ_URL=amqp://admin:admin@rabbitmq:5672
      - MEILI_HOST=http://meilisearch:7700
    depends_on:
      redis:
        condition: service_started
    networks:
      - micro-net
    restart: unless-stopped

  # -------- Infra --------

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - micro-net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks:
      - micro-net
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: meilisearch
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=masterKey
      - MEILI_ENV=development
    volumes:
      - meilidata:/meili_data
    networks:
      - micro-net
    restart: unless-stopped

networks:
  micro-net:
    driver: bridge

volumes:
  redisdata:
  rabbitmqdata:
  meilidata:
